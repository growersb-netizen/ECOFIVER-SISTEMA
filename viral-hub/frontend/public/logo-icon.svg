<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="g-warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFB300"/>
      <stop offset="50%"  stop-color="#FF6800"/>
      <stop offset="100%" stop-color="#FF2D95"/>
    </linearGradient>
    <linearGradient id="g-cool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
  </defs>
  <!-- V izquierda -->
  <line x1="8"  y1="10" x2="28" y2="70" stroke="url(#g-warm)" stroke-width="13" stroke-linecap="round"/>
  <!-- V derecha / H izquierda -->
  <line x1="28" y1="70" x2="48" y2="10" stroke="url(#g-cool)" stroke-width="13" stroke-linecap="round"/>
  <!-- H vertical izq -->
  <line x1="48" y1="10" x2="48" y2="70" stroke="url(#g-cool)" stroke-width="13" stroke-linecap="round"/>
  <!-- H travesaño -->
  <line x1="48" y1="40" x2="68" y2="40" stroke="url(#g-cool)" stroke-width="13" stroke-linecap="round"/>
  <!-- H vertical der -->
  <line x1="68" y1="10" x2="68" y2="70" stroke="url(#g-cool)" stroke-width="13" stroke-linecap="round"/>
  <!-- Speed lines -->
  <line x1="76" y1="53" x2="90" y2="53" stroke="#FF6800" stroke-width="5" stroke-linecap="round"/>
  <line x1="76" y1="63" x2="87" y2="63" stroke="#FF2D95" stroke-width="4" stroke-linecap="round"/>
  <circle cx="93" cy="63" r="4" fill="#7C3AED"/>
</svg>
