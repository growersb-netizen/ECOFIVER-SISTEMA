# Railway — configuración para el backend FastAPI
# Root directory del servicio: viral-hub/
# El frontend va en Vercel (rootDirectory: frontend)

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
buildCommand = ""

[deploy]
startCommand = "sh -c 'cd /app && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
