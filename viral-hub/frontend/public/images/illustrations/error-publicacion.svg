<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" fill="none">
  <defs>
    <linearGradient id="cloud-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>

  <!-- Nube triste -->
  <circle cx="110" cy="100" r="38" fill="url(#cloud-g)"/>
  <circle cx="140" cy="88" r="44" fill="url(#cloud-g)"/>
  <circle cx="172" cy="100" r="34" fill="url(#cloud-g)"/>
  <rect x="76" y="100" width="128" height="44" fill="url(#cloud-g)"/>
  <rect x="80" y="118" width="120" height="28" rx="0" fill="url(#cloud-g)"/>

  <!-- Cara triste en la nube -->
  <circle cx="125" cy="100" r="4" fill="white" opacity="0.8"/>
  <circle cx="155" cy="100" r="4" fill="white" opacity="0.8"/>
  <path d="M124 112 Q140 106 156 112" stroke="white" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Triángulo de advertencia -->
  <circle cx="200" cy="140" r="30" fill="white"/>
  <path d="M200 118 L222 155 L178 155 Z" fill="#F59E0B"/>
  <rect x="198" y="128" width="4" height="14" rx="2" fill="white"/>
  <circle cx="200" cy="148" r="2.5" fill="white"/>

  <!-- Gotas de lluvia / error -->
  <line x1="100" y1="152" x2="96"  y2="168" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="155" x2="116" y2="172" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  <line x1="140" y1="153" x2="136" y2="170" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>

  <!-- Texto -->
  <text x="110" y="192" text-anchor="middle"
    font-family="Poppins, system-ui" font-weight="700" font-size="13" fill="#334155">
    Algunas publicaciones fallaron
  </text>
  <text x="110" y="206" text-anchor="middle"
    font-family="Poppins, system-ui" font-size="10" fill="#64748B">
    No te preocupes, podés reintentar solo las que fallaron.
  </text>
</svg>
