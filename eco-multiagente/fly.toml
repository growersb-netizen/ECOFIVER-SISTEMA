# fly.toml app configuration file generated for eco-multiagente-polished-sunset-4227 on 2026-04-24T16:28:59-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'eco-multiagente-polished-sunset-4227'
primary_region = 'gru'

[build]

[env]
  ENVIRONMENT = 'production'
  PORT        = '8080'
  DATA_DIR    = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory    = '512mb'
  cpus      = 1
  memory_mb = 512

[mounts]
  source      = 'eco_config_data'
  destination = '/data'
