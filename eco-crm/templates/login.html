<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Login · EcoFiver CRM</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-main">ECOFIVER</div>
      <div style="color:var(--teal);font-size:14px;font-weight:600;letter-spacing:1px">& PISCINAS</div>
      <div class="logo-sub">Sistema de Gestión</div>
    </div>

    {% if error %}
    <div class="alert alert-error" style="margin-bottom:20px">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" placeholder="usuario@ecomodulos.com"
               required autocomplete="username" style="font-size:16px">
      </div>

      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-control"
               required autocomplete="current-password" style="font-size:16px">
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-full" style="margin-top:8px">
        Ingresar
      </button>
    </form>
  </div>
</div>
</body>
</html>
