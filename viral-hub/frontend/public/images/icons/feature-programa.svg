<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C8F0"/>
      <stop offset="100%" stop-color="#0099CC"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#00AADD" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="96" height="96" rx="24" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Calendario -->
  <rect x="20" y="28" width="56" height="44" rx="8" fill="white" opacity="0.95"/>
  <rect x="20" y="28" width="56" height="16" rx="8" fill="rgba(0,150,200,0.2)"/>
  <!-- Argollas -->
  <line x1="34" y1="20" x2="34" y2="32" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <line x1="62" y1="20" x2="62" y2="32" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <!-- Grilla días -->
  <circle cx="34" cy="54" r="3.5" fill="#00AADD"/>
  <circle cx="48" cy="54" r="3.5" fill="#00AADD" opacity="0.5"/>
  <circle cx="62" cy="54" r="3.5" fill="#00AADD" opacity="0.5"/>
  <circle cx="34" cy="64" r="3.5" fill="#00AADD" opacity="0.5"/>
  <circle cx="48" cy="64" r="3.5" fill="#00AADD"/>
  <circle cx="62" cy="64" r="3.5" fill="#FF6800" opacity="0.8"/>
</svg>
