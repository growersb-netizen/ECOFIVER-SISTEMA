<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 90" fill="none">
  <defs>
    <linearGradient id="g-warm-d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFB300"/>
      <stop offset="45%"  stop-color="#FF6800"/>
      <stop offset="100%" stop-color="#FF2D95"/>
    </linearGradient>
    <linearGradient id="g-cool-d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7C3AED"/>
      <stop offset="55%"  stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="g-hub-d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FF6800"/>
      <stop offset="100%" stop-color="#FF2D95"/>
    </linearGradient>
  </defs>

  <!-- Isotipo VH -->
  <line x1="8"  y1="10" x2="28" y2="68" stroke="url(#g-warm-d)" stroke-width="13" stroke-linecap="round"/>
  <line x1="28" y1="68" x2="48" y2="10" stroke="url(#g-cool-d)" stroke-width="13" stroke-linecap="round"/>
  <line x1="48" y1="10" x2="48" y2="68" stroke="url(#g-cool-d)" stroke-width="13" stroke-linecap="round"/>
  <line x1="48" y1="39" x2="68" y2="39" stroke="url(#g-cool-d)" stroke-width="13" stroke-linecap="round"/>
  <line x1="68" y1="10" x2="68" y2="68" stroke="url(#g-cool-d)" stroke-width="13" stroke-linecap="round"/>
  <line x1="76" y1="51" x2="91" y2="51" stroke="#FF6800" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="76" y1="61" x2="88" y2="61" stroke="#FF2D95" stroke-width="4"   stroke-linecap="round"/>
  <circle cx="94" cy="61" r="4" fill="#7C3AED"/>

  <!-- VIRAL — blanco en fondo oscuro -->
  <text x="106" y="50"
    font-family="Poppins, system-ui, sans-serif"
    font-weight="800" font-size="38" letter-spacing="-0.5"
    fill="#ffffff">VIRAL</text>

  <!-- HUB — gradiente naranja→rosa -->
  <text x="106" y="78"
    font-family="Poppins, system-ui, sans-serif"
    font-weight="800" font-size="38" letter-spacing="-0.5"
    fill="url(#g-hub-d)">HUB</text>
</svg>
