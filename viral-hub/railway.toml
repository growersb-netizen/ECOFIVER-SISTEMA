# Railway — configuración para el backend y workers
# El frontend va separado en Vercel (monorepo con root directory = frontend/)

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Variables de entorno a configurar en Railway Dashboard:
# DATABASE_URL        → desde el service PostgreSQL de Railway
# REDIS_URL           → desde el service Redis de Railway
# SECRET_KEY, JWT_SECRET_KEY, ENCRYPTION_KEY → secrets
# META_APP_ID, META_APP_SECRET, etc. → OAuth apps
# STORAGE_* → Cloudflare R2
