version: "3.9"

services:

  # ── Caddy: HTTPS reverse proxy ──────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - eco-net
    depends_on:
      - multiagente
      - crm

  # ── Eco Multiagente (WhatsApp IA + paneles) ─────────────────────────────────
  multiagente:
    build:
      context: ../eco-multiagente
      dockerfile: Dockerfile
    container_name: multiagente
    restart: unless-stopped
    env_file:
      - .env.multiagente
    volumes:
      - multiagente_data:/data
    networks:
      - eco-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Eco CRM ─────────────────────────────────────────────────────────────────
  crm:
    build:
      context: ../eco-crm
      dockerfile: Dockerfile
    container_name: crm
    restart: unless-stopped
    env_file:
      - .env.crm
    volumes:
      - crm_data:/app/data
      - crm_uploads:/app/uploads
    networks:
      - eco-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  caddy_data:
  caddy_config:
  multiagente_data:
  crm_data:
  crm_uploads:

networks:
  eco-net:
    driver: bridge
