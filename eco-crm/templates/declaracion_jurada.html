<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Declaración jurada · EcoFiver</title>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#F6F8FB;color:#16232F}
  .wrap{max-width:520px;margin:0 auto;padding:48px 20px}
  .logo{font-family:Georgia,serif;font-weight:800;font-size:22px;color:#0B2350;text-align:center;margin-bottom:24px}
  .logo span{color:#4EC3B5}
  .card{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:28px}
  h1{font-size:20px;color:#0B2350;margin:0 0 16px}
  .texto{font-size:14px;line-height:1.7;color:#16232F;background:#F6F8FB;border:1px solid #E2E8F0;border-radius:10px;padding:16px;margin-bottom:18px}
  .check-row{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:#5C6B7A;margin-bottom:16px}
  button{width:100%;padding:14px;border:none;border-radius:10px;background:#0B2350;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
  button:disabled{opacity:.5}
  .ok-box{text-align:center;padding:20px 0}
  #msg{font-size:13px;text-align:center;margin-top:10px;color:#B3261E}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">ECO<span>FIVER</span></div>
  {% if venta.declaracion_jurada_confirmada_en %}
  <div class="card ok-box">
    <div style="font-size:40px">✅</div>
    <h1>Declaración jurada recibida</h1>
    <p style="color:#5C6B7A">Ya podés continuar con el resto del proceso de tu plan.</p>
  </div>
  {% else %}
  <div class="card">
    <h1>Declaración jurada</h1>
    <p style="font-size:13.5px;color:#5C6B7A">Cliente: {{ venta.cliente_nombre }} — DNI {{ venta.cliente_dni }}</p>
    <div class="texto">{{ texto }}</div>
    <label class="check-row"><input type="checkbox" id="acepto"> He leído y comprendo el texto de la declaración jurada, y presto conformidad con su contenido.</label>
    <button onclick="confirmar()" id="btn" disabled>Confirmar declaración jurada</button>
    <div id="msg"></div>
  </div>
  {% endif %}
</div>
<script>
document.getElementById('acepto')?.addEventListener('change', e => {
  document.getElementById('btn').disabled = !e.target.checked;
});
async function confirmar(){
  const btn = document.getElementById('btn');
  btn.disabled = true; btn.textContent = 'Confirmando…';
  try{
    const r = await fetch('/api/public/confirmar-declaracion-jurada/{{ token }}', {method:'POST'});
    if(!r.ok) throw new Error();
    location.reload();
  }catch(e){
    document.getElementById('msg').textContent = 'No pudimos confirmar. Probá de nuevo.';
    btn.disabled = false; btn.textContent = 'Confirmar declaración jurada';
  }
}
</script>
</body>
</html>
