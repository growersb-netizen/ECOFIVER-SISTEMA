<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal del Aliado · EcoFiver</title>
<style>
  :root{ --green:#16a34a; --bg:#0f1115; --card:#171a21; --border:#252a33; --txt:#e8eaed; --muted:#9aa2ad; }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
  .brand{text-align:center;margin:26px 0 18px}
  .brand h1{margin:0;font-size:20px;letter-spacing:.5px}
  .brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:#0d0f13;color:var(--txt);font-size:16px}
  button{width:100%;padding:13px;border:none;border-radius:10px;background:var(--green);color:#fff;font-weight:700;font-size:15px;cursor:pointer;margin-top:14px}
  button:disabled{opacity:.6}
  .msg{color:#f87171;font-size:14px;margin-top:10px;text-align:center;min-height:18px}
  .kpis{display:flex;gap:12px;flex-wrap:wrap}
  .kpi{flex:1;min-width:130px;background:#0d0f13;border:1px solid var(--border);border-radius:12px;padding:14px}
  .kpi .v{font-size:22px;font-weight:800}
  .kpi .l{font-size:12px;color:var(--muted)}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;padding:8px;border-bottom:1px solid var(--border)}
  td{padding:9px 8px;border-bottom:1px solid #1e222a;font-size:14px}
  .badge{font-size:11px;padding:2px 8px;border-radius:9px;font-weight:700}
  .b-ok{background:#173a24;color:#4ade80}.b-pend{background:#3a3320;color:#fbbf24}.b-rej{background:#3a1a1a;color:#f87171}
  .hidden{display:none}
  h3{margin:18px 0 8px;font-size:15px}
  .logout{background:transparent;border:1px solid var(--border);color:var(--muted);width:auto;padding:8px 14px;margin:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><h1>🤝 Portal del Aliado</h1><p>EcoFiver</p></div>

  <!-- LOGIN -->
  <div class="card" id="login-card">
    <label>Código de aliado</label>
    <input id="p-cod" placeholder="AL-004" autocapitalize="characters">
    <label>PIN</label>
    <input id="p-pin" type="password" inputmode="numeric" placeholder="••••">
    <button id="p-btn" onclick="entrar()">Entrar</button>
    <div class="msg" id="p-msg"></div>
  </div>

  <!-- PANEL -->
  <div id="panel" class="hidden">
    <div class="card" style="display:flex;justify-content:space-between;align-items:center">
      <div><strong id="a-nombre"></strong> <span class="badge b-ok" id="a-estado"></span>
        <div style="color:var(--muted);font-size:13px" id="a-cod"></div></div>
      <button class="logout" onclick="salir()">Salir</button>
    </div>
    <div class="card">
      <div class="kpis">
        <div class="kpi"><div class="v" id="k-leads">0</div><div class="l">Leads cargados</div></div>
        <div class="kpi"><div class="v" id="k-verif">0</div><div class="l">Verificados</div></div>
        <div class="kpi"><div class="v" style="color:#fbbf24" id="k-pend">$0</div><div class="l">Comisión pendiente</div></div>
        <div class="kpi"><div class="v" style="color:var(--green)" id="k-liq">$0</div><div class="l">Comisión liquidada</div></div>
      </div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Mis leads</h3>
      <div id="leads-wrap"></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Mis comisiones</h3>
      <div id="com-wrap"></div>
    </div>
  </div>
</div>

<script>
function fmt(n){return '$'+(n||0).toLocaleString('es-AR')}
async function entrar(){
  const cod=document.getElementById('p-cod').value.trim().toUpperCase();
  const pin=document.getElementById('p-pin').value.trim();
  const msg=document.getElementById('p-msg'); const btn=document.getElementById('p-btn');
  if(!cod||!pin){msg.textContent='Completá código y PIN';return;}
  btn.disabled=true; msg.textContent='';
  try{
    const r=await fetch('/api/public/aliado-portal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({codigo:cod,pin})});
    const d=await r.json();
    if(!r.ok){msg.textContent=d.detail||'Código o PIN incorrecto';btn.disabled=false;return;}
    render(d);
  }catch(e){msg.textContent='Error de conexión';btn.disabled=false;}
}
function render(d){
  document.getElementById('login-card').classList.add('hidden');
  document.getElementById('panel').classList.remove('hidden');
  document.getElementById('a-nombre').textContent=d.aliado.nombre;
  document.getElementById('a-cod').textContent=d.aliado.codigo;
  const est=document.getElementById('a-estado'); est.textContent=d.aliado.estado;
  est.className='badge '+(d.aliado.operativo?'b-ok':'b-pend');
  const leads=d.leads||[];
  document.getElementById('k-leads').textContent=leads.length;
  document.getElementById('k-verif').textContent=leads.filter(l=>l.estado_verificacion==='verificado').length;
  document.getElementById('k-pend').textContent=fmt(d.comisiones.pendiente);
  document.getElementById('k-liq').textContent=fmt(d.comisiones.liquidado);
  document.getElementById('leads-wrap').innerHTML = leads.length? (
    '<table><thead><tr><th>Cliente</th><th>Estado</th><th>Verif.</th><th>Fecha</th></tr></thead><tbody>'+
    leads.map(l=>{const b=l.estado_verificacion==='verificado'?'b-ok':(l.estado_verificacion==='rechazado'?'b-rej':'b-pend');
      return '<tr><td>'+l.nombre+'<div style="color:#9aa2ad;font-size:11px">'+(l.localidad||'')+'</div></td><td>'+l.estado+
      '</td><td><span class="badge '+b+'">'+l.estado_verificacion+'</span></td><td style="font-size:12px">'+
      (l.created_at?new Date(l.created_at).toLocaleDateString('es-AR'):'—')+'</td></tr>';}).join('')+'</tbody></table>'
  ) : '<div style="color:#9aa2ad">Todavía no cargaste leads.</div>';
  const com=d.comisiones.items||[];
  document.getElementById('com-wrap').innerHTML = com.length? (
    '<table><thead><tr><th>Solicitud</th><th>Tipo</th><th>Monto</th><th>Estado</th></tr></thead><tbody>'+
    com.map(c=>'<tr><td>'+(c.solicitud_numero||'—')+'</td><td>'+c.tipo+'</td><td>'+fmt(c.monto)+
      '</td><td><span class="badge '+(c.estado==='liquidada'?'b-ok':'b-pend')+'">'+c.estado+'</span></td></tr>').join('')+'</tbody></table>'
  ) : '<div style="color:#9aa2ad">Sin comisiones todavía.</div>';
}
function salir(){location.reload();}
document.getElementById('p-pin').addEventListener('keydown',e=>{if(e.key==='Enter')entrar();});
</script>
</body>
</html>
