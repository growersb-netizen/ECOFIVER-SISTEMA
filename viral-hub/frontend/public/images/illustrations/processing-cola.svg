<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" fill="none">
  <defs>
    <linearGradient id="phone-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="bar-g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
  </defs>

  <!-- Teléfono -->
  <rect x="95" y="30" width="90" height="155" rx="16" fill="url(#phone-g)"/>
  <rect x="100" y="45" width="80" height="125" rx="8" fill="white"/>
  <!-- Notch -->
  <rect x="123" y="33" width="34" height="6" rx="3" fill="#0F172A"/>

  <!-- Contenido en pantalla -->
  <!-- Barra de progreso -->
  <rect x="110" y="70" width="60" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="110" y="70" width="44" height="6" rx="3" fill="url(#bar-g)"/>

  <!-- Íconos plataformas en cola -->
  <circle cx="122" cy="100" r="10" fill="#000"/>
  <text x="122" y="105" text-anchor="middle" font-size="9" fill="white">TT</text>
  <circle cx="140" cy="100" r="10" fill="url(#bar-g)" opacity="0.7"/>
  <circle cx="158" cy="100" r="10" fill="#FF0000" opacity="0.7"/>

  <!-- Líneas de texto simuladas -->
  <rect x="108" y="120" width="64" height="5" rx="2.5" fill="#E2E8F0"/>
  <rect x="115" y="130" width="50" height="4" rx="2" fill="#F1F5F9"/>
  <rect x="120" y="139" width="40" height="4" rx="2" fill="#F1F5F9"/>

  <!-- Check pequeño -->
  <circle cx="175" cy="70" r="8" fill="#22C55E"/>
  <path d="M170 70 L174 74 L181 65" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Textos -->
  <text x="140" y="200" text-anchor="middle"
    font-family="Poppins, system-ui" font-weight="600" font-size="13" fill="#334155">
    Procesando...
  </text>
  <text x="140" y="213" text-anchor="middle"
    font-family="Poppins, system-ui" font-size="11" fill="#64748B">
    Tu contenido está en cola.
  </text>
</svg>
