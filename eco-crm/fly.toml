# fly.toml app configuration file generated for eco-crm-dawn-fog-5476 on 2026-04-24T15:41:41-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'eco-crm-dawn-fog-5476'
primary_region = 'gru'

[build]

[env]
  DATABASE_URL = 'sqlite:////app/data/eco_crm.db'
  ENVIRONMENT = 'production'
  PORT = '8000'

[[mounts]]
  source = 'eco_crm_data'
  destination = '/app/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512

[[statics]]
  guest_path = '/app/static'
  url_prefix = '/static'
