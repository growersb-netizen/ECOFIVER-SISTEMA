<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 90" fill="none">
  <defs>
    <!-- Gradiente cálido: amarillo-naranja-rosa (para la V y parte izquierda) -->
    <linearGradient id="g-warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFB300"/>
      <stop offset="45%"  stop-color="#FF6800"/>
      <stop offset="100%" stop-color="#FF2D95"/>
    </linearGradient>
    <!-- Gradiente frío: violeta-azul-cian (para la H y parte derecha) -->
    <linearGradient id="g-cool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7C3AED"/>
      <stop offset="55%"  stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <!-- Gradiente HUB texto: naranja→rosa -->
    <linearGradient id="g-hub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FF6800"/>
      <stop offset="100%" stop-color="#FF2D95"/>
    </linearGradient>
  </defs>

  <!-- ══ Isotipo VH ══════════════════════════════════════════════════════ -->

  <!-- V — pierna izquierda (cálida) -->
  <line x1="8"  y1="10" x2="28" y2="68" stroke="url(#g-warm)" stroke-width="13" stroke-linecap="round"/>
  <!-- V — pierna derecha / H vertical izquierda (fría) -->
  <line x1="28" y1="68" x2="48" y2="10" stroke="url(#g-cool)" stroke-width="13" stroke-linecap="round"/>

  <!-- H — vertical izquierda (continúa del vértice de V arriba) -->
  <line x1="48" y1="10" x2="48" y2="68" stroke="url(#g-cool)" stroke-width="13" stroke-linecap="round"/>
  <!-- H — travesaño -->
  <line x1="48" y1="39" x2="68" y2="39" stroke="url(#g-cool)" stroke-width="13" stroke-linecap="round"/>
  <!-- H — vertical derecha -->
  <line x1="68" y1="10" x2="68" y2="68" stroke="url(#g-cool)" stroke-width="13" stroke-linecap="round"/>

  <!-- Líneas de velocidad -->
  <line x1="76" y1="51" x2="91" y2="51" stroke="#FF6800" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="76" y1="61" x2="88" y2="61" stroke="#FF2D95" stroke-width="4"   stroke-linecap="round"/>
  <circle cx="94" cy="61" r="4" fill="#7C3AED"/>

  <!-- ══ Logotipo texto ═══════════════════════════════════════════════════ -->

  <!-- VIRAL — negro oscuro -->
  <text
    x="106" y="50"
    font-family="Poppins, system-ui, sans-serif"
    font-weight="800"
    font-size="38"
    letter-spacing="-0.5"
    fill="#0F172A"
  >VIRAL</text>

  <!-- HUB — gradiente naranja→rosa -->
  <text
    x="106" y="78"
    font-family="Poppins, system-ui, sans-serif"
    font-weight="800"
    font-size="38"
    letter-spacing="-0.5"
    fill="url(#g-hub)"
  >HUB</text>
</svg>
